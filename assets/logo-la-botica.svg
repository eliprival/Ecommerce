<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">La Botica</title>
  <desc id="desc">Logotipo circular de La Botica con hojas centrales, flores doradas y borde degradado verde a dorado.</desc>
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1222" />
      <stop offset="70%" stop-color="#1a1222" />
      <stop offset="100%" stop-color="#0f0a16" />
    </radialGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00695c" />
      <stop offset="45%" stop-color="#008a6f" />
      <stop offset="70%" stop-color="#b09c4e" />
      <stop offset="100%" stop-color="#f0c55a" />
    </linearGradient>
    <linearGradient id="flowerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d36b" />
      <stop offset="100%" stop-color="#d4a72c" />
    </linearGradient>
    <pattern id="flowerOfLife" x="0" y="0" width="0.2" height="0.2" patternUnits="objectBoundingBox">
      <g opacity="0.18" stroke="#d4b473" stroke-width="1.5" fill="none">
        <circle cx="32" cy="32" r="30" />
        <circle cx="0" cy="32" r="30" />
        <circle cx="32" cy="0" r="30" />
        <circle cx="64" cy="32" r="30" />
        <circle cx="32" cy="64" r="30" />
        <circle cx="0" cy="0" r="30" />
        <circle cx="64" cy="0" r="30" />
        <circle cx="0" cy="64" r="30" />
        <circle cx="64" cy="64" r="30" />
      </g>
    </pattern>
    <path id="topArc" d="M96 177a160 160 0 0 1 320 0" fill="none" />
    <path id="bottomArc" d="M96 335a160 160 0 0 0 320 0" fill="none" />
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#ringGradient)" />
  <circle cx="256" cy="256" r="210" fill="url(#bgGradient)" stroke="#f7f1df" stroke-width="6" />
  <circle cx="256" cy="256" r="188" fill="url(#flowerOfLife)" />
  <g fill="none" stroke="#f2e8c9" stroke-width="4" stroke-linecap="round">
    <path d="M256 158c-42 32-74 90-74 138 0 44 33 74 74 74s74-30 74-74c0-48-32-106-74-138z" />
    <path d="M256 168c-24 26-42 70-42 110 0 30 19 52 42 52s42-22 42-52c0-40-18-84-42-110z" />
    <path d="M256 178c-12 24-22 56-22 88 0 20 10 34 22 34s22-14 22-34c0-32-10-64-22-88z" />
  </g>
  <g fill="none" stroke="url(#flowerGradient)" stroke-width="6" stroke-linecap="round">
    <path d="M198 348c38 14 78 14 116 0" />
  </g>
  <g transform="translate(128 188)">
    <g transform="translate(0 0)" fill="url(#flowerGradient)">
      <path d="M18 86c20-32 40-32 60 0-20 32-40 32-60 0z" opacity="0.75" />
      <path d="M204 86c20-32 40-32 60 0-20 32-40 32-60 0z" opacity="0.75" />
    </g>
  </g>
  <g fill="url(#flowerGradient)" opacity="0.9">
    <path d="M128 256c0-18 14-32 32-32s32 14 32 32-14 32-32 32-32-14-32-32zm42 0c0-5.5-4.5-10-10-10s-10 4.5-10 10 4.5 10 10 10 10-4.5 10-10z" />
    <path d="M320 256c0-18 14-32 32-32s32 14 32 32-14 32-32 32-32-14-32-32zm42 0c0-5.5-4.5-10-10-10s-10 4.5-10 10 4.5 10 10 10 10-4.5 10-10z" />
  </g>
  <text font-family="'Cinzel Decorative', 'Times New Roman', serif" font-size="38" fill="#f5f0d3" letter-spacing="6" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">LA BOTICA</textPath>
  </text>
  <text font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="24" fill="#f5f0d3" letter-spacing="5" text-anchor="middle">
    <textPath href="#bottomArc" startOffset="50%">PRODUCTOS NATURALES</textPath>
  </text>
</svg>
